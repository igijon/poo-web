
name: Publish Quarto

on:
  push:
    branches: main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      # Instalar Java 21 LTS
      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Instalar Graphviz
      - name: Install Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz

      # Instalar PlantUML actualizado
      - name: Install PlantUML
        run: |
          wget https://github.com/plantuml/plantuml/releases/download/v1.2026.10/plantuml-1.2026.10.jar \
            -O plantuml.jar

          sudo mv plantuml.jar /usr/local/lib/plantuml.jar

          sudo tee /usr/local/bin/plantuml > /dev/null <<'EOF'
          #!/bin/bash
          java -jar /usr/local/lib/plantuml.jar "$@"
          EOF

          sudo chmod +x /usr/local/bin/plantuml

      # Comprobar herramientas
      - name: Check PlantUML
        run: |
          java -version
          dot -V
          plantuml -version
          plantuml -testdot

      # Renderizar Quarto
      - name: Render
        uses: quarto-dev/quarto-actions/render@v2

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
